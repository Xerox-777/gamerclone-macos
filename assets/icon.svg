<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a24"/>
  <circle cx="256" cy="256" r="220" fill="#22222e" stroke="#6366f1" stroke-width="4"/>
  
  <!-- Game controller shape -->
  <g transform="translate(256, 256)">
    <!-- Controller body -->
    <ellipse cx="0" cy="20" rx="120" ry="60" fill="#6366f1"/>
    <ellipse cx="-80" cy="0" rx="50" ry="50" fill="#6366f1"/>
    <ellipse cx="80" cy="0" rx="50" ry="50" fill="#6366f1"/>
    
    <!-- D-pad -->
    <rect x="-95" y="-15" width="30" height="10" rx="2" fill="#22222e"/>
    <rect x="-85" y="-25" width="10" height="30" rx="2" fill="#22222e"/>
    
    <!-- Buttons -->
    <circle cx="70" cy="-10" r="8" fill="#22c55e"/>
    <circle cx="90" cy="10" r="8" fill="#ef4444"/>
    <circle cx="70" cy="10" r="8" fill="#f59e0b"/>
    <circle cx="90" cy="-10" r="8" fill="#3b82f6"/>
  </g>
  
  <!-- Microphone icon (representing voice) -->
  <g transform="translate(256, 380)">
    <rect x="-15" y="-40" width="30" height="50" rx="15" fill="#22c55e"/>
    <path d="M-25 0 Q-25 30 0 30 Q25 30 25 0" fill="none" stroke="#22c55e" stroke-width="4"/>
    <line x1="0" y1="30" x2="0" y2="50" stroke="#22c55e" stroke-width="4"/>
    <line x1="-15" y1="50" x2="15" y2="50" stroke="#22c55e" stroke-width="4"/>
  </g>
  
  <!-- Sound waves -->
  <g transform="translate(256, 150)" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.7">
    <path d="M-60 0 Q-60 -30 -30 -30"/>
    <path d="M-70 0 Q-70 -45 -30 -45"/>
    <path d="M60 0 Q60 -30 30 -30"/>
    <path d="M70 0 Q70 -45 30 -45"/>
  </g>
</svg>
